name: Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  quality:
    name: Validate nightly build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked

  build:
    name: Build ${{ matrix.name }} nightly
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: windows-arm64
            os: windows-11-arm
          - name: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          tar -C target/release -czf "release-assets/holiday-nightly-${{ matrix.name }}.tar.gz" holiday
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path target/release/holiday.exe -DestinationPath "release-assets/holiday-nightly-${{ matrix.name }}.zip"
      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: holiday-nightly-${{ matrix.name }}-${{ github.run_id }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish rolling nightly release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: holiday-nightly-*-${{ github.run_id }}
          path: release-assets
          merge-multiple: true
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=nightly
          short_sha="${GITHUB_SHA:0:12}"
          {
            echo "Rolling ARM64 nightly build of Holiday from main."
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > nightly-notes.md

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              -f sha="$GITHUB_SHA" \
              -F force=true
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --latest=false \
              --title "Holiday nightly (${short_sha})" \
              --notes-file nightly-notes.md
          fi

          shopt -s nullglob
          assets=(release-assets/*)
          if ((${#assets[@]} == 0)); then
            echo "No nightly assets were downloaded" >&2
            exit 1
          fi
          gh release upload "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Holiday nightly (${short_sha})" \
            --notes-file nightly-notes.md \
            --prerelease \
            --latest=false
