[package]
name = "holiday"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = "3.0"
similar = { version = "2.6", features = ["text"] }
scraper = "0.20"
directories = "5.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
unicode-segmentation = "1.13"
unicode-width = "0.2"
fs2 = "0.4.3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.0", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.0", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.0", features = ["sync-secret-service", "crypto-rust"] }
# Build D-Bus without requiring system development packages in CI.
dbus = { version = "0.9", features = ["vendored"] }

[dev-dependencies]
http = "1"
